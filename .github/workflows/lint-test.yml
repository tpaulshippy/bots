name: Lint and Test

on:
  push:
    branches: [main]
  pull_request:
    # Stacked roadmap PRs target their parent feature branch; run checks
    # for those too so every PR in the stack shows backend/frontend status.
    branches: [main, 'feature/**']

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: |
          cd front
          npm ci --legacy-peer-deps

      - name: Run lint
        run: |
          cd front
          npm run lint

      - name: Run tests
        run: |
          cd front
          npm test -- --passWithNoTests --coverage=false --watchAll=false

  backend-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: back/requirements.txt

      - name: Install dependencies
        run: |
          cd back
          pip install -r requirements.txt
          pip install ruff

      - name: Run ruff
        run: |
          cd back
          ruff check bots/ server/

  backend-test:
    runs-on: ubuntu-latest

    # Serial by design. The suite runs in one pass in well under a minute, so
    # path sharding no longer pays for itself: three shards each pay ~2.5s of
    # Django bootstrap, and required a guard that failed whenever a new test
    # file was not manually assigned to a shard. If the suite ever grows past
    # a couple of minutes again, add pytest-xdist (`pytest -n auto`) instead of
    # hand-maintained shards.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: back/requirements.txt

      - name: Install dependencies
        run: |
          cd back
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd back
          pytest