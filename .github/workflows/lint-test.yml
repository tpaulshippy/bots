name: Lint and Test

on:
  push:
    branches: [main]
  pull_request:
    # Stacked roadmap PRs target their parent feature branch; run checks
    # for those too so every PR in the stack shows backend/frontend status.
    branches: [main, 'feature/**']

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: |
          cd front
          npm ci --legacy-peer-deps

      - name: Run lint
        run: |
          cd front
          npm run lint

      - name: Run tests
        run: |
          cd front
          npm test -- --passWithNoTests --coverage=false --watchAll=false

  backend-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: back/requirements.txt

      - name: Install dependencies
        run: |
          cd back
          pip install -r requirements.txt
          pip install ruff

      - name: Run ruff
        run: |
          cd back
          ruff check bots/ server/

      # Explicit path sharding skips new test files silently; fail loudly
      # instead so the author assigns the new file to a shard.
      - name: Verify every test file is assigned to exactly one shard
        run: |
          assigned=$(grep -o 'bots/tests/test_[a-z0-9_]*\.py' .github/workflows/lint-test.yml | sort -u)
          all=$(cd back && ls bots/tests/test_*.py | sort -u)
          duplicates=$(grep -o 'bots/tests/test_[a-z0-9_]*\.py' .github/workflows/lint-test.yml | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "Test files assigned to multiple shards:"; echo "$duplicates"; exit 1
          fi
          diff <(echo "$assigned") <(echo "$all") \
            && echo "All test files assigned to exactly one shard."

  backend-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Shard 1: slowest file (pin_reauth) + fast unit/small API files.
          # Solo timing ~71s, 99 tests.
          - shard: 1
            paths: >-
              bots/tests/test_pin_reauth.py
              bots/tests/test_srs.py
              bots/tests/test_chat.py
              bots/tests/test_account.py
              bots/tests/test_bot_api.py
              bots/tests/test_signals.py
          # Shard 2: auth-heavy files + fast safety suite. Solo timing ~65s, 139 tests.
          - shard: 2
            paths: >-
              bots/tests/test_delegated_login.py
              bots/tests/test_onboarding.py
              bots/tests/test_flashcard_api.py
              bots/tests/test_safety.py
          # Shard 3: API breadth. Solo timing ~69s, 110 tests.
          - shard: 3
            paths: >-
              bots/tests/test_spaced_repetition_api.py
              bots/tests/test_activity.py
              bots/tests/test_chat_stream.py
              bots/tests/test_object_lookup.py
              bots/tests/test_security.py
              bots/tests/test_profile_photo.py
              bots/tests/test_digest_command.py
              bots/tests/test_seed_e2e_onboarding.py

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: back/requirements.txt

      - name: Install dependencies
        run: |
          cd back
          pip install -r requirements.txt

      - name: Run tests (shard ${{ matrix.shard }})
        run: |
          cd back
          pytest ${{ matrix.paths }}