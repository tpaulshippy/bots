name: Lint and Test

on:
  push:
    branches: [main]
  pull_request:
    # Stacked roadmap PRs target their parent feature branch; run checks
    # for those too so every PR in the stack shows backend/frontend status.
    branches: [main, 'feature/**']

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: |
          cd front
          npm ci --legacy-peer-deps

      - name: Run lint
        run: |
          cd front
          npm run lint

      - name: Run tests
        run: |
          cd front
          npm test -- --passWithNoTests --coverage=false --watchAll=false

  worker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: |
          cd worker
          npm ci

      - name: Run typecheck
        run: |
          cd worker
          npm run typecheck

      - name: Run tests
        run: |
          cd worker
          npm test
