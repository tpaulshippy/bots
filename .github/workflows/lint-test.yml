name: Lint and Test

on:
  push:
    branches: [main]
  pull_request:
    # Stacked roadmap PRs target their parent feature branch; run checks
    # for those too so every PR in the stack shows backend/frontend status.
    branches: [main, 'feature/**']

jobs:
  # Lint and the test suite are independent, and running them one after the
  # other in a single job cost the sum of both. Separate jobs let them run on
  # separate runners at the same time, and each reports its own status on the
  # PR instead of one combined pass/fail.
  frontend-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: |
          cd front
          npm ci --legacy-peer-deps

      - name: Run lint
        run: |
          cd front
          npm run lint

  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: |
          cd front
          npm ci --legacy-peer-deps

      - name: Cache Jest transform output
        uses: actions/cache@v4
        with:
          # Matches the cacheDirectory in front/package.json. Babel output for
          # the dependency tree is the bulk of a cold suite run, and it only
          # changes when a dependency or the Babel/Jest config changes.
          path: front/node_modules/.cache/jest
          key: jest-${{ runner.os }}-${{ hashFiles('front/package-lock.json') }}-${{ hashFiles('front/babel.config.js', 'front/jest.setup.js', 'front/package.json') }}
          restore-keys: |
            jest-${{ runner.os }}-${{ hashFiles('front/package-lock.json') }}-
          # Jest keys each transform entry on file content, so editing a source
          # file adds a new entry without disturbing the existing ones. Without
          # this, an exact key hit skips the save and those new entries are
          # thrown away, leaving every later run to recompile the same edited
          # files. Hashing the sources into the key instead would work but
          # would change the key on every edit, so the save would happen anyway
          # and exact hits would become rare. The cache is ~9MB, cheap enough to
          # rewrite each run.
          save-always: true

      - name: Run tests
        run: |
          cd front
          npm test -- --passWithNoTests --coverage=false --watchAll=false

  backend-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: back/requirements.txt

      - name: Install dependencies
        run: |
          cd back
          pip install -r requirements.txt
          pip install ruff

      - name: Run ruff
        run: |
          cd back
          ruff check bots/ server/

  backend-test:
    runs-on: ubuntu-latest

    # Serial by design. The suite runs in one pass in well under a minute, so
    # path sharding no longer pays for itself: three shards each pay ~2.5s of
    # Django bootstrap, and required a guard that failed whenever a new test
    # file was not manually assigned to a shard. If the suite ever grows past
    # a couple of minutes again, add pytest-xdist (`pytest -n auto`) instead of
    # hand-maintained shards.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: back/requirements.txt

      - name: Install dependencies
        run: |
          cd back
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd back
          pytest