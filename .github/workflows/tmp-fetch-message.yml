name: TEMP fetch one message

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read one assistant message from production
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          printf '%s\n' "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key .github/tmp_fetch_message.py root@"$SERVER_HOST":/tmp/q.py
          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key root@"$SERVER_HOST" "cd /home/bots/repo/back && ../venv/bin/python manage.py shell < /tmp/q.py"
