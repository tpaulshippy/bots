name: Deploy

on:
  workflow_run:
    workflows: [Lint and Test]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Build web app
        env:
          EXPO_PUBLIC_API_BASE_URL: https://syftlearning.app/api
        run: |
          cd front
          npm ci --legacy-peer-deps
          npx expo export --platform web --output-dir dist --clear --no-bytecode

      - name: Deploy to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          printf '%s\n' "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key root@$SERVER_HOST << 'EOF'
            set -e
            cd /home/bots/repo
            git pull --ff-only
            rm -rf front/dist.deploy
            mkdir -p front/dist.deploy
          EOF
          scp -o StrictHostKeyChecking=no -i /tmp/deploy_key -r front/dist/. root@$SERVER_HOST:/home/bots/repo/front/dist.deploy/
          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key root@$SERVER_HOST << 'EOF'
            set -e
            cd /home/bots/repo
            rm -rf front/dist
            mv front/dist.deploy front/dist
            cd back
            ../venv/bin/pip install -r requirements.txt
            ../venv/bin/python manage.py migrate --noinput || true
            sudo systemctl restart bots
          EOF
