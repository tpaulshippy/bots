name: Deploy

on:
  workflow_run:
    workflows: [Lint and Test]
    types: [completed]
    branches: [main]

# Only one deploy at a time; extra runs wait their turn.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Build web app
        env:
          # Served by the Cloudflare Pages site (site/dist: marketing at /
          # + Expo web app at /app/*). /api/* goes to the Worker via the
          # syftlearning.app/api/* route, see worker/wrangler.toml).
          # Native apps use the same URL.
          EXPO_PUBLIC_API_BASE_URL: https://syftlearning.app/api
        run: |
          cd front
          npm ci --legacy-peer-deps
          npx expo export --platform web --output-dir dist --clear --no-bytecode

      - name: Deploy Pages site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node site/build.mjs --from-main
          cd worker
          npx wrangler pages deploy ../site/dist --project-name syft-site

      - name: Setup Node.js (worker)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Provision D1 + R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd worker
          # wrangler.toml ships an all-zero database_id placeholder: resolve
          # the real id by name (creating the database on first run) and
          # inject it, so `d1 migrations apply` below targets a real DB.
          DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="syft-db") | .uuid // empty')
          if [ -z "$DB_ID" ]; then
            DB_ID=$(npx wrangler d1 create syft-db --json | jq -r .uuid)
          fi
          sed -i "s/database_id = \".*\"/database_id = \"$DB_ID\"/" wrangler.toml
          # Idempotent: succeeds on first run, no-op (|| true) after that.
          npx wrangler r2 bucket create syft-images || true

      - name: Deploy Worker API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd worker
          npm ci
          # Apply pending D1 migrations, then deploy. The SQLite seed import
          # (scripts/migrate-from-sqlite.mjs) is a one-time cutover step run
          # manually, not on every deploy.
          npx wrangler d1 migrations apply syft-db --remote
          npx wrangler deploy
