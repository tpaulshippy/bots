        name: id
        schema:
          type: string
        required: true
      tags:
      - activity
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityChatList'
          description: ''
  /api/activity/summary/:
    get:
