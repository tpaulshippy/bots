openapi: 3.0.3
info:
  title: Bots API
  version: 1.0.0
  description: API for the Bots application
paths:
  /api/activity/chats/:
    get:
      operationId: activity_chats_list
      description: |-
        Parent inbox: list recent chats across profiles + read-only transcript.

        Read-only by design: parents review here, they never write into the kid
        thread (roadmap 04 non-goal).
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - activity
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityChatListList'
          description: ''
  /api/activity/chats/{id}/:
    get:
      operationId: activity_chats_retrieve
      description: |-
        Parent inbox: list recent chats across profiles + read-only transcript.

        Read-only by design: parents review here, they never write into the kid
        thread (roadmap 04 non-goal).
      parameters:
