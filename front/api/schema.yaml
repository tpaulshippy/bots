      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/token/:
    post:
      operationId: token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/token/refresh/:
    post:
      operationId: token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/user:
    get:
      operationId: user_retrieve
      tags:
      - user
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: user_create
      tags:
      - user
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/user/delete:
    delete:
      operationId: user_delete_destroy
      tags:
      - user
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/user/onboarding/complete:
    post:
      operationId: user_onboarding_complete_create
      description: Mark onboarding complete. Idempotent; teen delegated sessions are
        403.
      tags:
      - user
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/user/pin:
    delete:
      operationId: user_pin_destroy
      description: |-
        DELETE /api/user/pin — remove the parent PIN (opt out of PIN protection).

        Body: {"currentPin": "1234"}. Always requires a valid parent reauth
        session plus the current PIN when one is set, so a kid holding the
        device cannot be the one to turn protection off. No-op success when no
        PIN is set. After removal, parent mutations rely on the parent session
        alone (see ParentReauthRequired).
      tags:
      - user
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
