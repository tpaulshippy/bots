      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HtmlPageLink'
          description: ''
  /api/html-pages/{page_id}/raw/:
    get:
      operationId: html_pages_raw_retrieve
      description: |-
        Serve stored HTML for viewing on the local machine's browser.

        Same Django origin as /app/ (no extra host), but CSP `sandbox`
        without `allow-same-origin` puts it in an opaque origin: page JS
        cannot read Syft cookies, localStorage, or parent DOM, and
        `connect-src 'none'` blocks exfiltration.

        Auth: session/JWT as usual, or a short-lived `?sig=` from `link`
        for browser handoffs that cannot attach headers. Either way the
        page must belong to the caller's profile.
      parameters:
      - in: path
        name: page_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: sig
        schema:
          type: string
        description: Short-lived signed handoff token from the link action.
      tags:
      - html-pages
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
          description: ''
  /api/login:
    get:
      operationId: login_retrieve
      tags:
      - login
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/login/web:
    get:
      operationId: login_web_retrieve
      tags:
      - login
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/onboarding/bootstrap:
    post:
      operationId: onboarding_bootstrap_create
      description: 'Atomic wizard save: profile name, first bot, PIN and completion
        flag.'
      tags:
      - onboarding
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/profiles/:
    get:
      operationId: profiles_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - profiles
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProfileList'
          description: ''
    post:
      operationId: profiles_create
      tags:
      - profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Profile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Profile'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/profiles/{id}/:
    get:
      operationId: profiles_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this profile.
        required: true
      tags:
      - profiles
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
    put:
      operationId: profiles_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this profile.
        required: true
      tags:
      - profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profile'
          application/x-www-form-urlencoded:
